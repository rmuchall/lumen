[package]
name = "lumen"
version = "0.1.39"
description = "A fast, lightweight, offline Markdown viewer"
edition = "2024"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
inotify = { version = "=0.11.4", default-features = false }
pulldown-cmark = "=0.13.4"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
toml = { version = "=1.1.4", default-features = false, features = ["parse"] }
tree-sitter-highlight = "=0.26.12"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
