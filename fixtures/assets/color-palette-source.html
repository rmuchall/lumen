<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumen colour palette reference</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: #ffffff;
        color: #14202c;
        font:
          16px system-ui,
          sans-serif;
        margin: 0;
        padding: 40px;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        color: #526273;
        margin: 0 0 28px;
      }
      .grid {
        display: grid;
        gap: 24px;
        grid-template-columns: 1fr 1fr;
      }
      .theme {
        border: 1px solid #c5d5e0;
        border-radius: 10px;
        overflow: hidden;
      }
      .title {
        font-weight: 700;
        padding: 14px 16px;
      }
      .row {
        align-items: center;
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(170px, 1fr) 84px;
        min-height: 38px;
        padding: 6px 16px;
      }
      .label {
        font-size: 14px;
      }
      .swatch {
        border: 1px solid #94a3b8;
        border-radius: 5px;
        height: 26px;
      }
      .dark .title,
      .dark .row {
        background: #282828;
        color: #e2e8f0;
      }
      .light .title,
      .light .row {
        background: #f4f4f1;
        color: #25313d;
      }
    </style>
  </head>
  <body>
    <h1>Lumen colour palette</h1>
    <p>Exact visual reference for the current light and dark appearances.</p>
    <main class="grid" id="palette"></main>
    <script>
      const entries = [
        ["Document background", "#1a1a1a", "#fcfcfc"],
        ["General surface", "#2d2d2d", "#efefef"],
        ["Code surface", "#2b2b2a", "#eef0f6"],
        ["Input background", "#202020", "#f8f8f8"],
        ["Table header", "#2b2b2a", "#eef0f6"],
        ["Table stripe", "#262625", "#f3f5fa"],
        ["Border", "#535353", "#cdcdcd"],
        ["Main text", "#e4e4e4", "#303030"],
        ["Heading", "#f5f5f5", "#1c1c1c"],
        ["Muted text", "#bdbdbd", "#5f5f5f"],
        ["Quote surface", "#2b2b2a", "#eef0f6"],
        ["Accent", "#0284c7", "#0284c7"],
        ["Accent hover", "#0ea5e9", "#0ea5e9"],
        ["Link", "#38bdf8", "#0369a1"],
        ["Link hover", "#7dd3fc", "#075985"],
        ["Production label", "#4ade80", "#166534"],
        ["Note alert surface", "#183542", "#e2f2fa"],
        ["Tip alert surface", "#193728", "#e5f6ea"],
        ["Important alert surface", "#332941", "#eee8fa"],
        ["Warning alert surface", "#492e0f", "#fff3e0"],
        ["Caution alert surface", "#45191d", "#ffebee"],
        ["Warning background", "#4a2508", "#fff3e0"],
        ["Warning text", "#fbbf24", "#b54708"],
        ["Error background", "#4c1014", "#ffebee"],
        ["Error text", "#f87171", "#c81e1e"],
        ["Syntax comments", "#b3b3b3", "#5f5f5f"],
        ["Syntax constants/tags", "#fda4af", "#be123c"],
        ["Syntax functions", "#93c5fd", "#075985"],
        ["Syntax keywords", "#c4b5fd", "#7e22ce"],
        ["Syntax numbers", "#fcd34d", "#854d0e"],
        ["Syntax punctuation", "#bdbdbd", "#5f5f5f"],
        ["Syntax strings", "#86efac", "#166534"],
        ["Syntax types", "#67e8f9", "#0f677f"],
        ["Syntax variables", "#f2f2f2", "#303030"],
      ];
      const palette = document.querySelector("#palette");
      for (const [theme, column] of [
        ["dark", 1],
        ["light", 2],
      ]) {
        const section = document.createElement("section");
        section.className = `theme ${theme}`;
        section.innerHTML = `<div class="title">${theme[0].toUpperCase()}${theme.slice(1)} appearance</div>`;
        for (const entry of entries) {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `<span class="label">${entry[0]}</span><span class="swatch" style="background:${entry[column]}"></span>`;
          section.append(row);
        }
        palette.append(section);
      }
    </script>
  </body>
</html>
